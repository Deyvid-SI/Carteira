spring:
  datasource:
    url: jdbc:h2:mem:carteira-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  thymeleaf:
    cache: false
app:
  demo-user:
    enabled: false
