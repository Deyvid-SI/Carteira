spring:
  datasource:
    url: jdbc:h2:mem:carteira-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  thymeleaf:
    cache: false
app:
  jwt:
    # Chave exclusiva do ambiente de testes. Nunca use esta chave em desenvolvimento ou produção.
    secret: chave-exclusiva-para-testes-da-carteira-0123456789
    expiration: 15m
    issuer: carteira-acao-test
  demo-user:
    enabled: false
